<!DOCTYPE html>
<html>
<head>
    <meta name="title" content="Media Test">
    <title>Telegram Chat Export</title>
</head>
<body>
    <h1>Media Test</h1>
    
    <div class="message" id="media1">
        <div class="from_name">Photographer</div>
        <div class="date">Mar 10, 2024, 5:00 PM</div>
        <div class="text">Check out this photo!</div>
        <img src="photos/2024-03-10_17-00-00.jpg" alt="Photo"/>
    </div>
    
    <div class="message" id="media2">
        <div class="from_name">Videographer</div>
        <div class="date">Mar 10, 2024, 5:05 PM</div>
        <div class="text">And here's a video</div>
        <video src="videos/2024-03-10_17-05-00.mp4"></video>
    </div>
    
    <div class="message" id="file1">
        <div class="from_name">DocumentSharer</div>
        <div class="date">Mar 10, 2024, 5:10 PM</div>
        <div class="text">Here's the document</div>
        <a href="files/document.pdf">document.pdf</a>
    </div>
</body>
</html>
