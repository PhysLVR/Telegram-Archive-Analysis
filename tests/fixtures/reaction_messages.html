<!DOCTYPE html>
<html>
<head><title>Reactions Test (SYNTHETIC)</title></head>
<body>
<div class="chatlog">
    <!-- Message with reactions -->
    <div id="message10" class="message default clearfix">
        <div class="from_name">Alice</div>
        <div class="pull_right date details" title="15.02.2025 10:30:00 UTC+03:30">10:30</div>
        <div class="text">Message with reactions below</div>
        
        <div class="reactions">
            <span class="reaction">
                <span class="emoji">👍</span>
                <span class="count">5</span>
            </span>
            <span class="reaction">
                <span class="emoji">❤️</span>
                <span class="count">3</span>
            </span>
            <span class="reaction">
                <span class="emoji">🎉</span>
                <span class="count">1</span>
            </span>
        </div>
    </div>
    
    <!-- Message with single reaction -->
    <div id="message11" class="message default clearfix">
        <div class="from_name">Bob</div>
        <div class="pull_right date details" title="15.02.2025 10:31:00 UTC+03:30">10:31</div>
        <div class="text">Message with one reaction</div>
        
        <div class="reactions">
            <span class="reaction">
                <span class="emoji">😂</span>
                <span class="count">2</span>
            </span>
        </div>
    </div>
    
    <!-- Message without reactions -->
    <div id="message12" class="message default clearfix">
        <div class="from_name">Charlie</div>
        <div class="pull_right date details" title="15.02.2025 10:32:00 UTC+03:30">10:32</div>
        <div class="text">Message without any reactions</div>
    </div>
</div>
</body>
</html>
