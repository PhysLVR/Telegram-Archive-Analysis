<!DOCTYPE html>
<html>
<head>
    <meta name="title" content="Edited Messages Test">
    <title>Telegram Chat Export</title>
</head>
<body>
    <h1>Edited Messages Test</h1>
    
    <div class="message" id="edit1">
        <div class="from_name">Editor</div>
        <div class="date">Jul 10, 2024, 3:00 PM</div>
        <div class="text">Original text</div>
        <span class="edited">edited Jul 10, 2024, 3:05 PM</span>
    </div>
    
    <div class="message" id="edit2">
        <div class="from_name">AnotherEditor</div>
        <div class="date">Jul 10, 2024, 3:10 PM</div>
        <div class="text">This was edited too</div>
        <span class="edited">edited at 3:15 PM</span>
    </div>
    
    <div class="message" id="normal1">
        <div class="from_name">NormalUser</div>
        <div class="date">Jul 10, 2024, 3:20 PM</div>
        <div class="text">This message was never edited</div>
    </div>
</body>
</html>
