<!DOCTYPE html>
<html>
<head>
    <meta name="title" content="Formatted Messages Test">
    <title>Telegram Chat Export</title>
</head>
<body>
    <h1>Formatted Messages Test</h1>
    
    <div class="message" id="msg1">
        <div class="from_name">User1</div>
        <div class="date">Feb 20, 2024, 2:00 PM</div>
        <div class="text"><b>Bold text</b> and <i>italic text</i></div>
    </div>
    
    <div class="message" id="msg2">
        <div class="from_name">User2</div>
        <div class="date">Feb 20, 2024, 2:01 PM</div>
        <div class="text">Text with <a href="https://example.com">a link</a> embedded</div>
    </div>
    
    <div class="message" id="msg3">
        <div class="from_name">User1</div>
        <div class="date">Feb 20, 2024, 2:02 PM</div>
        <div class="text">Code: <code>print("hello")</code></div>
    </div>
    
    <div class="message" id="msg4">
        <div class="from_name">User3</div>
        <div class="date">Feb 20, 2024, 2:03 PM</div>
        <div class="text">Multi<br>line<br>message</div>
    </div>
</body>
</html>
