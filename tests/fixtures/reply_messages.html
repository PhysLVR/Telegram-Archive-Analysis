<!DOCTYPE html>
<html>
<head>
    <meta name="title" content="Reply Test">
    <title>Telegram Chat Export</title>
</head>
<body>
    <h1>Reply Test</h1>
    
    <div class="message" id="msg100">
        <div class="from_name">OriginalSender</div>
        <div class="date">Apr 5, 2024, 9:00 AM</div>
        <div class="text">This is the original message</div>
    </div>
    
    <div class="message" id="msg101">
        <div class="from_name">Responder</div>
        <div class="date">Apr 5, 2024, 9:01 AM</div>
        <div class="reply">
            <a href="message.html#message100">OriginalSender</a>
        </div>
        <div class="text">I'm replying to that message</div>
    </div>
    
    <div class="message" id="msg102">
        <div class="from_name">ThirdPerson</div>
        <div class="date">Apr 5, 2024, 9:02 AM</div>
        <div class="text">And I'm joining the conversation</div>
    </div>
</body>
</html>
